<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3157a4"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><title>StudyPilot</title></head>
<body><header><b>StudyPilot</b><small id="status">端末に保存</small></header><main>
<nav><button class="tab active" data-tab="today">今日の計画</button><button class="tab" data-tab="profile">プロフィール</button><button class="tab" data-tab="history">学習記録</button></nav>
<section id="today" class="page"><h1>今日の学習計画</h1><p class="muted">今日の状況を入力して計画を作成します。</p>
<form id="planForm" class="card grid">
<label>日付<input id="date" type="date" required></label><label>開始時刻<input id="start" type="time" value="17:30"></label><label>学習可能時間（分）<input id="minutes" type="number" min="15" max="900" value="120"></label><label>疲労度<select id="fatigue"><option value="low">低い</option><option value="medium" selected>普通</option><option value="high">高い</option></select></label>
<label class="wide">テスト・模試<textarea id="tests" rows="2" placeholder="例：金曜に数学の小テスト"></textarea></label><label class="wide">提出課題<textarea id="assignments" rows="2" placeholder="例：数学の問題集 p.30〜35"></textarea></label><label class="wide">今日の重点<textarea id="focus" rows="2" placeholder="例：数学IIの微分"></textarea></label><button class="primary wide">計画を作成・更新</button></form><div id="plan" class="card empty">ここに今日の計画が表示されます。</div></section>
<section id="profile" class="page hidden"><h1>学習プロフィール</h1><form id="profileForm" class="card grid">
<label>学年<input id="grade" placeholder="例：高校2年"></label><label>志望大学<input id="school" placeholder="大学名"></label><label>志望学部・学科<input id="faculty" placeholder="学部・学科"></label><label>受験方式<input id="exam" placeholder="例：一般選抜"></label><label class="wide">得意科目<input id="strong" placeholder="例：英語"></label><label class="wide">苦手科目<input id="weak" placeholder="例：数学"></label><label class="wide">受験科目・配点<textarea id="subjects" rows="3"></textarea></label><label class="wide">使用教材・勉強方法<textarea id="methods" rows="3"></textarea></label><label class="wide">追加の指示・事情<textarea id="instructions" rows="4"></textarea></label><button class="primary wide">プロフィールを保存</button></form>
<div class="card"><h2>バックアップ</h2><p class="muted">端末の故障やブラウザデータ削除に備え、定期的に保存してください。</p><button id="export">JSONを書き出す</button><label class="file">バックアップを読み込む<input id="import" type="file" accept=".json,application/json"></label><button id="reset" class="danger">全データを削除</button></div>
<div class="card muted">この初期版はルールベースで計画を作成します。生成AIによる志望校調査や自由記述の高度な解釈は行いません。</div></section>
<section id="history" class="page hidden"><h1>学習記録</h1><div id="stats" class="stats"></div><div id="records"></div></section></main><footer>データはこのブラウザ内に保存されます</footer><script src="./app.js" defer></script></body></html>
